name: Temporary dependency lock refresh

on:
  pull_request:
    branches: [dev]
    types: [synchronize]

permissions:
  contents: write

jobs:
  refresh:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'audit/security-browser-hardening-2026-11'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/security-browser-hardening-2026-11
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Refresh pnpm lockfile from pruned manifest
        run: pnpm install --no-frozen-lockfile
      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo 'Already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m 'build: refresh pnpm lockfile after removing unused dependencies'
          git push origin HEAD:refs/heads/audit/security-browser-hardening-2026-11

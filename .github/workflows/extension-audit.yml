name: Extension audit

on:
  workflow_dispatch:
  pull_request:
    branches:
      - dev

permissions:
  contents: read

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Security and regression tests
        run: node --test tests/*.test.mjs
      - name: Build both browser targets
        run: pnpm run build
      - name: Validate packaged manifests and assets
        run: node scripts/verify-build.mjs
      - name: Calculate packaged ZIP sizes
        run: |
          for target in chrome firefox; do
            (cd "dist/$target" && zip -q -9 -r "../../epubespiar-$target.zip" .)
            echo "$target archive bytes: $(stat -c%s "epubespiar-$target.zip")"
            echo "$target largest payload files:"
            find "dist/$target" -type f -printf '%s %p\n' | sort -nr | head -12
          done
      - uses: actions/upload-artifact@v4
        with:
          name: epubespiar-browser-zips
          path: |
            epubespiar-chrome.zip
            epubespiar-firefox.zip
      - name: Dependency vulnerability gate (high and critical)
        run: pnpm audit --audit-level high
